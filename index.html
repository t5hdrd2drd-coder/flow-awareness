    <script>
        const APP_VERSION = 'v44';

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(`./sw.js?v=${APP_VERSION}`)
                    .catch((err) => { console.log('PWA 註冊失敗:', err); });
            });
        }

        (function setupLanguage() {
            const userLang = navigator.language || navigator.userLanguage || '';
            const isZh = userLang.toLowerCase().includes('zh');
            const titleStr = isZh ? "流動覺察" : "Flow awareness";
            document.title = `${titleStr} — Flow Awareness`;
            const appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitleMeta) appleTitleMeta.content = titleStr;
        })();

        (function generateHighResAppIcon() {
            const iconCanvas = document.createElement('canvas'); iconCanvas.width = 512; iconCanvas.height = 512;
            const ictx = iconCanvas.getContext('2d'); 
            
            ictx.fillStyle = '#030105'; ictx.fillRect(0, 0, 512, 512);

            const bgGlow = ictx.createRadialGradient(256, 256, 10, 256, 256, 240);
            bgGlow.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
            bgGlow.addColorStop(0.2, 'rgba(56, 189, 248, 0.5)');
            bgGlow.addColorStop(0.5, 'rgba(255, 180, 80, 0.35)');
            bgGlow.addColorStop(1, 'rgba(3, 1, 5, 0)');
            ictx.fillStyle = bgGlow; ictx.fillRect(0, 0, 512, 512);

            ictx.save();
            ictx.shadowColor = 'rgba(255, 180, 80, 0.85)';
            ictx.shadowBlur = 32;
            ictx.beginPath(); ictx.arc(256, 256, 138, 0, Math.PI * 2);
            ictx.lineWidth = 12; ictx.strokeStyle = '#ffb450';
            ictx.stroke();
            ictx.restore();

            ictx.save();
            ictx.shadowColor = 'rgba(56, 189, 248, 0.9)';
            ictx.shadowBlur = 24;
            ictx.beginPath(); ictx.arc(256, 256, 90, 0, Math.PI * 2);
            ictx.lineWidth = 9; ictx.strokeStyle = '#38bdf8';
            ictx.stroke();
            ictx.restore();

            ictx.save();
            ictx.shadowColor = '#ffffff'; ictx.shadowBlur = 20;
            ictx.beginPath(); ictx.arc(256, 256, 20, 0, Math.PI * 2);
            ictx.fillStyle = '#ffffff'; ictx.fill();
            ictx.restore();

            const pngDataUrl = iconCanvas.toDataURL('image/png');
            const favEl = document.getElementById('dynamic-favicon');
            const appleEl = document.getElementById('dynamic-apple-icon');
            if (favEl) favEl.href = pngDataUrl;
            if (appleEl) appleEl.href = pngDataUrl;

            const splashCanvas = document.createElement('canvas');
            splashCanvas.width = 1280; splashCanvas.height = 2778;
            const sctx = splashCanvas.getContext('2d');
            sctx.fillStyle = '#030105'; sctx.fillRect(0, 0, 1280, 2778);
            const startupElem = document.getElementById('dynamic-startup-image');
            if (startupElem) startupElem.href = splashCanvas.toDataURL('image/png');
        })();

        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        let lastTouchEnd = 0; document.addEventListener('touchend', (e) => { const now = Date.now(); if (now - lastTouchEnd <= 300) { e.preventDefault(); } lastTouchEnd = now; }, { passive: false });
        document.addEventListener('gesturestart', (e) => e.preventDefault()); document.addEventListener('gesturechange', (e) => e.preventDefault()); document.addEventListener('gestureend', (e) => e.preventDefault()); document.addEventListener('selectstart', (e) => e.preventDefault());
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        let state = 'INIT'; 
        let audioCtx = null, sessionStartTime = 0, globalNoiseBuffer = null, wakeLock = null;

                    guideDir = 1;
                    isCurrentPhaseInhale = true;

                    // 開啟互動層與停止按鈕
                    document.getElementById('interaction-layer').style.display = 'block';
                    const btnStop = document.getElementById('btn-stop');
                    btnStop.style.display = 'block';
                    setTimeout(() => { btnStop.style.opacity = '1'; }, 50);

                    // 不呼叫 triggerBreathTextChange 以免打斷淡入，讓 MINDFULNESS 自然接管
                    updateUIStateForMindfulness(0);
                    if (textEl) textEl.classList.add('glow-inhale'); // 補上吸氣字樣的微光脈動
                }

                guideAnimFrame = requestAnimationFrame(animateGuide);
                return;
            }

            let elapsedSecs = (Date.now() - sessionStartTime) / 1000;

            if (elapsedSecs > 30) {
                let progress = Math.min(1.0, (elapsedSecs - 30) / 120); 
                let smoothedProgress = progress * progress * (3 - 2 * progress); 
                baseInhalePace = 3.2 + smoothedProgress * 0.4; 
            } else { baseInhalePace = 3.2; }

            let currentPhaseDur = isCurrentPhaseInhale ? baseInhalePace : (baseInhalePace * EXHALE_RATIO);
            guidePhase += guideDir * (dt / currentPhaseDur);
            
            if (guidePhase >= 1) { 
                guidePhase = 1; guideDir = -1; 
                if (isCurrentPhaseInhale) { 
                    isCurrentPhaseInhale = false; 
                    checkPaceAdaptation(); 
                    triggerBreathTextChange(false); 
                    if (!isPressing && hasInhaledInCurrentCycle) { 
                        playBreathSound(false); 
                    }
                } 
            } 
            else if (guidePhase <= 0) { 
                guidePhase = 0; guideDir = 1; 
                if (!isCurrentPhaseInhale) { 
                    isCurrentPhaseInhale = true; 
                    hasInhaledInCurrentCycle = false; 
                    checkPaceAdaptation(); 
                    triggerBreathTextChange(true); 
                } 
            }

            let p = guidePhase; let eased = p * p * p * (p * (p * 6 - 15) + 10);
            
            let targetUserPhase = 0.0;
            if (isCurrentPhaseInhale) {
                targetUserPhase = isPressing ? guidePhase : 0.0;
            } else {
                targetUserPhase = guidePhase;
            }

            let phaseDiff = targetUserPhase - userPhase;
            let k = isPressing ? 4.5 : 3.8; 
            userPhase += phaseDiff * (1.0 - Math.exp(-k * dt));

            if (userPhase > 1) userPhase = 1;
            if (userPhase < 0) userPhase = 0;

            let uP = userPhase; let userEased = uP * uP * uP * (uP * (uP * 6 - 15) + 10);
            
            let scale = 1 + eased * 1.2; let opacity = 0.25 + eased * 0.55; 
            if (guideRingEl) { guideRingEl.style.transform = `scale(${scale})`; guideRingEl.style.opacity = opacity; }
            
            currentCoreScale = 1.0 + userEased * 1.2;
            
            let targetRes = (isCurrentPhaseInhale === isPressing) ? 1.0 : 0.0;
            currentResonance += (targetRes - currentResonance) * 0.08;
            updateUIStateForMindfulness(elapsedSecs);
            cycleResonanceSum += currentResonance; cycleResonanceCount++; sumResonance += currentResonance; resonanceSamples++;

            let targetR = isCurrentPhaseInhale ? 255 : 56; let targetG = isCurrentPhaseInhale ? 180 : 189; let targetB = isCurrentPhaseInhale ? 77 : 248;
            currR += (targetR - currR) * 0.05; currG += (targetG - currG) * 0.05; currB += (targetB - currB) * 0.05;
            cachedColorStr = `${Math.floor(currR)}, ${Math.floor(currG)}, ${Math.floor(currB)}`;
            document.documentElement.style.setProperty('--c-r', Math.floor(currR)); document.documentElement.style.setProperty('--c-g', Math.floor(currG)); document.documentElement.style.setProperty('--c-b', Math.floor(currB));

            let bloom = Math.sin(guidePhase * (Math.PI / 2));
            guideRingEl.style.borderColor = `rgba(${cachedColorStr}, 0.75)`; 
            guideRingEl.style.boxShadow = `0 0 ${12 + bloom * 24}px rgba(${cachedColorStr}, ${0.35 + bloom * 0.45}), inset 0 0 ${6 + bloom * 8}px rgba(255,255,255,${0.18 + bloom * 0.2})`;

            if (isPressing) { targetBreathScale = 0.7 - currentResonance * 0.1; } else { targetBreathScale = 1.1 + currentResonance * 0.2; }
            guideAnimFrame = requestAnimationFrame(animateGuide);
        }

        const firstClickEl = document.getElementById('first-click');

        function handleFirstClick(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (state !== 'INIT') return; 
            state = 'INTRO';

            initAudio(); 
            initCanvas(); 

            if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            firstClickEl.style.pointerEvents = 'none'; 
            firstClickEl.style.opacity = '0';

            setTimeout(() => { 
                firstClickEl.style.display = 'none'; 
                const introEl = document.getElementById('intro');
                introEl.style.display = 'flex'; 
                setTimeout(() => { introEl.style.opacity = '1'; }, 50); 
            }, 800);
        }

        firstClickEl.addEventListener('pointerdown', handleFirstClick);
        firstClickEl.addEventListener('touchstart', handleFirstClick, { passive: false });
        firstClickEl.addEventListener('click', handleFirstClick);

        /* 【點擊開始正念】：徹底截斷 CSS 動畫殘影 */
        document.getElementById('btn-start').addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (state !== 'INTRO') return; 
            
            state = 'PREPARATION';
            prepStartTime = performance.now();
            currentCoreScale = 0.25; 
            isEndingDissolve = false;
            hasTriggeredRipple = false; 
            
            currR = 255; currG = 180; currB = 80;
            cachedColorStr = "255, 180, 80";

            requestWakeLock();

            document.getElementById('intro').style.opacity = '0'; 
            document.getElementById('btn-start').classList.add('disabled'); 
            
            document.getElementById('sky-bg').classList.add('active');
            const mainContainer = document.getElementById('main-container');
            const coreCanvasEl = document.getElementById('core-canvas');
            
            mainContainer.style.opacity = '1'; 
            coreCanvasEl.style.opacity = '1';

            // 最關鍵的一步：拔掉 transition 並歸零 opacity，消滅上一次迴圈殘留的「鬼影字體」
            const elementsToHide = [topHeaderEl, guideRingEl, textEl, hintEl];
            elementsToHide.forEach(el => {
                if (el) {
                    el.style.transition = 'none';
                    el.style.opacity = '0';
                }
            });

            setTimeout(() => {
                document.getElementById('intro').style.display = 'none'; 
            }, 1200);

            if (guideAnimFrame) cancelAnimationFrame(guideAnimFrame);
            guideAnimFrame = requestAnimationFrame(animateGuide);
        });

        document.getElementById('btn-stop').addEventListener('pointerdown', (e) => e.stopPropagation()); document.getElementById('btn-stop').addEventListener('mousedown', (e) => e.stopPropagation()); document.getElementById('btn-stop').addEventListener('touchstart', (e) => e.stopPropagation(), { passive: false });
        
        document.getElementById('btn-stop').addEventListener('click', (e) => {
            e.stopPropagation(); if(state !== 'MINDFULNESS') return; state = 'SUMMARY';
            isEndingDissolve = true; releaseWakeLock();
            document.getElementById('interaction-layer').style.display = 'none'; document.getElementById('btn-stop').style.pointerEvents = 'none'; document.getElementById('btn-stop').style.opacity = '0';
            isPressing = false; stopAllBreathAudio(); playEndingBowl();
            let totalSecs = sessionStartTime === 0 ? 0 : Math.max(0, Math.floor((Date.now() - sessionStartTime) / 1000));
            let mins = String(Math.floor(totalSecs / 60)).padStart(2, '0'); let secs = String(totalSecs % 60).padStart(2, '0');
            document.getElementById('summary-time').innerText = `${mins}:${secs}`; document.getElementById('summary-stats').innerText = `共完成了 ${totalBreaths} 次呼吸`;
            document.getElementById('main-container').style.transition = 'opacity 4s ease'; document.getElementById('main-container').style.opacity = '0';
            document.getElementById('sky-bg').style.transition = 'filter 4s ease'; document.getElementById('sky-bg').style.filter = 'blur(80px)'; 
            document.getElementById('summary-overlay').style.display = 'flex'; setTimeout(() => { document.getElementById('summary-overlay').style.opacity = '1'; }, 100);
            setTimeout(() => { document.getElementById('btn-end').style.pointerEvents = 'auto'; document.getElementById('btn-end').style.opacity = '1'; }, 7000); 
        });

        document.getElementById('btn-end').addEventListener('click', (e) => {
            e.stopPropagation(); if(state !== 'SUMMARY') return; state = 'TRANSITION';
            const blackScreen = document.getElementById('black-transition'); blackScreen.style.pointerEvents = 'auto'; blackScreen.style.opacity = '1';
            killAllOldNodes(); fadeMasterOutAndSuspend();
            setTimeout(() => {
                if(document.fullscreenElement) { document.exitFullscreen().catch(e=>{}); }
                bowlMasterGain = null; isEndingDissolve = false;
                const summaryOverlay = document.getElementById('summary-overlay'); summaryOverlay.style.display = 'none'; summaryOverlay.style.opacity = '0';
                const btnEnd = document.getElementById('btn-end'); btnEnd.style.opacity = '0'; btnEnd.style.pointerEvents = 'none';
                document.getElementById('main-container').style.opacity = '0';
                document.getElementById('sky-bg').classList.remove('active'); document.getElementById('sky-bg').style.filter = 'blur(60px)';
                document.getElementById('hint').style.opacity = '0'; document.getElementById('btn-start').classList.remove('disabled'); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('btn-stop').style.pointerEvents = 'auto'; 
                textEl.classList.remove('glow-inhale', 'glow-exhale'); textEl.style.opacity = '0'; textEl.style.visibility = 'visible';
                
                // 重置前一次的參數與樣式，保證下一次循環乾淨無瑕
                missedInhaleCount = 0; userPressedInInhale = false; phaseChangeCount = 0; sessionStartTime = 0; baseInhalePace = 3.2; breathScale = 1.0; targetBreathScale = 1.0;
                const elementsToReset = [topHeaderEl, guideRingEl, textEl, hintEl];
                elementsToReset.forEach(el => {
                    if (el) { el.style.transition = 'none'; el.style.opacity = '0'; }
                });

                firstClickEl.style.display = 'flex'; firstClickEl.style.pointerEvents = 'auto'; firstClickEl.style.opacity = '1';
                document.getElementById('intro').style.display = 'none'; document.getElementById('intro').style.opacity = '0';
                state = 'INIT'; setTimeout(() => { blackScreen.style.opacity = '0'; blackScreen.style.pointerEvents = 'none'; }, 100);
            }, 1000); 
        });
    </script>
</body>
</html>
