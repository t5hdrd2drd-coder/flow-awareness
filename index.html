    <script>
      const APP_VERSION = 'v58';
      const QUOTE_VAULT = [{
          text: "讓你的前門和後門敞開著，讓念頭想來就來想走就走，別給它們奉茶就是了。",
          source: "《放不下，就握手言和吧》"
        },
        {
          text: "正念作為一種新的習慣，會慢慢取代分心或放空的舊習慣，讓我們不再迷失於挽不回的過去與到不了的未來。",
          source: "《放不下，就握手言和吧》"
        },
        {
          text: "沒什麼是恆久不變的，就連最艱困的時期也一樣。",
          source: "《我可能錯了》"
        },
        {
          text: "這也會過去。",
          source: "《我可能錯了》"
        },
        {
          text: "正確，從來就不是重點。",
          source: "《我可能錯了》"
        },
        {
          text: "你遇見的每個人，都在進行一場你一無所知的艱難戰鬥。與人為善，永遠如此。",
          source: "《我可能錯了》"
        },
        {
          text: "我有著念頭，但我的念頭並不代表我。",
          source: "《我可能錯了》"
        },
        {
          text: "與生命共舞，而不是試圖去控制它。",
          source: "《我可能錯了》"
        },
        {
          text: "放下讓我們不舒服的念頭，就算它們是對的。",
          source: "《我可能錯了》"
        },
        {
          text: "在是非對錯的想法之外，還有一片原野。我會在那裡與你相遇。",
          source: "魯米 (Rumi)"
        },
        {
          text: "正念是由刻意專注而生的覺知，置身當下，對體驗的來去不加批判。",
          source: "《平靜的心，專注的大腦》"
        },
        {
          text: "人所擁有的任何東西都可以被剝奪，唯獨人性最後的自由——在任何境遇中選擇一己態度和生活方式的自由——不能被剝奪。",
          source: "維克多·弗蘭克"
        },
        {
          text: "在刺激與回應之間，有一個空間。那個空間裡，藏著我們選擇回應的自由與力量。",
          source: "維克多·弗蘭克"
        },
        {
          text: "不被過去拉扯，不為未來焦慮；你所擁有的，只有當下的這一呼吸。",
          source: "一行禪師"
        },
        {
          text: "安住於此時此刻，不急著去到任何地方，亦無須成為任何其他人。",
          source: "喬·卡巴金"
        },
        {
          text: "如果問題有解，何必憂慮？如果問題無解，憂慮又有何用？",
          source: "達賴喇嘛"
        },
        {
          text: "寧靜並非來自環境的順遂，而是來自內心對現狀的接納。",
          source: "達賴喇嘛"
        },
        {
          text: "給自己一點時間，讓混濁的心水慢慢沉澱，答案自然清晰。",
          source: "達賴喇嘛"
        },
        {
          text: "允許一切發生。雜念如雲飄過，你只需成為那廣袤無垠的天空。",
          source: "正念導引"
        },
        {
          text: "你無法控制外在事件的發生，但你永遠能控制自己如何看待它。",
          source: "愛比克泰德"
        },
        {
          text: "靈魂的顏色，取決於你經常思考的事物。",
          source: "馬可·奧勒留《沉思錄》"
        },
        {
          text: "我們在想像中承受的痛苦，遠比在現實中承受的多。",
          source: "塞內卡"
        },
        {
          text: "專注於你手頭能做的事，並將其餘一切坦然交給命運。",
          source: "馬可·奧勒留《沉思錄》"
        },
        {
          text: "世上事物分為你能掌控的與你不能掌控的。將所有精力，投注於你能掌控的事情上。",
          source: "愛比克泰德《手冊》"
        },
        {
          text: "從微小的事物開始練習：一點撒出的油，一點被偷走的酒。告訴自己：『用這點代價，我換到了心靈的平靜與自由。』",
          source: "愛比克泰德《手冊》"
        },
        {
          text: "不要期待人們不犯錯，那是不可行也不可能的；轉而提醒自己，你有能力包容與理解。",
          source: "馬可·奧勒留《沉思錄》"
        },
        {
          text: "請賜予我平靜，去接受我無法改變的；賜予我勇氣，去改變我能改變的；並賜予我智慧，去分辨兩者的不同。",
          source: "斯多葛思想 / 《平靜禱詞》"
        },
        {
          text: "心不隨外境運轉，便是不被牽著走；不執著於任何念頭，心自然自由。",
          source: "《金剛經》白話意譯"
        },
        {
          text: "一切過往與幻象如夢幻泡影；唯有當下的覺察，真實存在。",
          source: "《金剛經》白話意譯"
        },
        {
          text: "水清月現，心靜智生。",
          source: "禪宗古諺"
        },
        {
          text: "心如明鏡，物來則應，物去不留。",
          source: "禪宗古諺"
        },
        {
          text: "不必企圖消滅雜念，只需不賦予它力量，它自會隨風消散。",
          source: "禪修指引"
        },
        {
          text: "當你停止尋找平靜，平靜就在你鬆開手的那一刻出現。",
          source: "禪宗智慧"
        },
        {
          text: "花開不張揚，風過不留痕。讓心如流水般自然穿過一切。",
          source: "禪意手記"
        }
      ];
      function getRandomQuote() {
        let availableIndices = [];
        try {
          let stored = localStorage.getItem('flow_quote_pool');
          if (stored) availableIndices = JSON.parse(stored);
        } catch (e) {}
        if (!availableIndices || availableIndices.length === 0) {
          availableIndices = QUOTE_VAULT.map((_, i) => i);
        }
        const randomIndex = Math.floor(Math.random() * availableIndices.length);
        const quoteIndex = availableIndices[randomIndex];

      interactLayer.addEventListener('pointercancel', handleRelease);
      interactLayer.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !e.repeat) {
          e.preventDefault();
          setPressState(true);
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') setPressState(false);
      });
      function checkPaceAdaptation() {
        phaseChangeCount++;
        if (!isCurrentPhaseInhale) totalBreaths++;
        let avgPhaseResonance = cycleResonanceCount > 0 ? (cycleResonanceSum / cycleResonanceCount) : 0;
        let isFirstTwoPhasePass = (phaseChangeCount <= 4 && userPressedInInhale);
        let isNormalPhasePass = (userPressedInInhale && avgPhaseResonance >= 0.65);
        if (phaseChangeCount <= 10 && !isCurrentPhaseInhale && (isFirstTwoPhasePass || isNormalPhasePass)) {
          triggerAffirmativeGlow();
        }
        if (isCurrentPhaseInhale) {
          if (!userPressedInInhale) {
            missedInhaleCount++;
          } else {
            missedInhaleCount = 0;
          }
          userPressedInInhale = false;
        }
        if (avgPhaseResonance >= 0.7) {
          consecutiveHighResonance++;
        } else {
          consecutiveHighResonance = 0;
        }
        cycleResonanceSum = 0;
        cycleResonanceCount = 0;
      }
      function animateGuide(now) {
        if (state !== 'MINDFULNESS' && state !== 'PREPARATION') {
          lastTime = now;
          guideAnimFrame = requestAnimationFrame(animateGuide);
          return;
        }
        if (!lastTime) lastTime = now;
        let dt = (now - lastTime) / 1000;
        lastTime = now;
        if (state === 'PREPARATION') {
          let pElapsed = now - prepStartTime;
          if (pElapsed < 1500) {
            let progress = pElapsed / 1500;
            let easedProg = progress * progress * (3 - 2 * progress);
            currentCoreScale = 0.25 + easedProg * 0.75;
            currR = 255;
            currG = 180;
            currB = 80;
            cachedColorStr = "255, 180, 80";
            currentResonance = 0.0;
          } else if (pElapsed >= 1500 && pElapsed < 2300) {
            currentCoreScale = 1.0;
            currR = 255;
            currG = 180;
            currB = 80;
            cachedColorStr = "255, 180, 80";
            currentResonance = 0.0;
            if (!hasTriggeredRipple) {
              hasTriggeredRipple = true;
              if (textEl) {
                textEl.innerText = "吸 氣";
                textEl.style.transition = 'opacity 0.8s ease';
                textEl.style.opacity = '0.9';
                textEl.style.visibility = 'visible';
              }
              if (guideRingEl) {
                guideRingEl.style.transition = 'box-shadow 0.1s ease-out, opacity 0.8s ease';
                guideRingEl.style.opacity = '0.25';
              }
            }
          } else if (pElapsed >= 2300) {
            state = 'MINDFULNESS';
            sessionStartTime = Date.now();
            guidePhase = 0;
            userPhase = 0;
            guideDir = 1;
            isCurrentPhaseInhale = true;
            if (topHeaderEl) {
              topHeaderEl.style.transition = 'opacity 2s ease';
              topHeaderEl.style.opacity = '1';
            }
            if (hintEl) {
              hintEl.innerText = "按住 空白鍵 / 螢幕 以吸氣";
              hintEl.style.transition = 'opacity 2s ease';
              hintEl.style.opacity = '0.9';
              hintEl.classList.add('flash-mild');
            }
            document.getElementById('interaction-layer').style.display = 'block';
            const btnStop = document.getElementById('btn-stop');
            btnStop.style.display = 'block';
            setTimeout(() => {
              btnStop.style.transition = 'all 0.4s ease, opacity 2s ease';
              btnStop.style.opacity = '1';
            }, 50);
          }
          guideAnimFrame = requestAnimationFrame(animateGuide);
          return;
        }
        let elapsedSecs = (Date.now() - sessionStartTime) / 1000;
        if (elapsedSecs > 30) {
          let progress = Math.min(1.0, (elapsedSecs - 30) / 120);
          let smoothedProgress = progress * progress * (3 - 2 * progress);
          baseInhalePace = 3.2 + smoothedProgress * 0.4;
        } else {
          baseInhalePace = 3.2;
        }
        let currentPhaseDur = isCurrentPhaseInhale ? baseInhalePace : (baseInhalePace * EXHALE_RATIO);
        guidePhase += guideDir * (dt / currentPhaseDur);
        if (guidePhase >= 1) {
          guidePhase = 1;
          guideDir = -1;
          if (isCurrentPhaseInhale) {
            isCurrentPhaseInhale = false;
            checkPaceAdaptation();
            triggerBreathTextChange(false);
            if (!isPressing && hasInhaledInCurrentCycle) {
              playBreathSound(false);
            }
          }
        } else if (guidePhase <= 0) {
          guidePhase = 0;
          guideDir = 1;
          if (!isCurrentPhaseInhale) {
            isCurrentPhaseInhale = true;
            hasInhaledInCurrentCycle = false;
            checkPaceAdaptation();
            triggerBreathTextChange(true);
          }
        }
        let p = guidePhase;
        let eased = p * p * p * (p * (p * 6 - 15) + 10);
        let targetUserPhase = 0.0;
        if (isCurrentPhaseInhale) {
          targetUserPhase = isPressing ? guidePhase : 0.0;
        } else {
          targetUserPhase = guidePhase;
        }
        let phaseDiff = targetUserPhase - userPhase;
        let k = isPressing ? 4.5 : 3.8;
        userPhase += phaseDiff * (1.0 - Math.exp(-k * dt));
        if (userPhase > 1) userPhase = 1;
        if (userPhase < 0) userPhase = 0;
        let uP = userPhase;
        let userEased = uP * uP * uP * (uP * (uP * 6 - 15) + 10);
        let scale = 1 + eased * 1.2;
        let opacity = 0.25 + eased * 0.55;
        if (guideRingEl) {
          guideRingEl.style.transform = `scale(${scale})`;
          guideRingEl.style.opacity = opacity;
        }
        currentCoreScale = 1.0 + userEased * 1.2;
        let targetRes = (isCurrentPhaseInhale === isPressing) ? 1.0 : 0.0;
        currentResonance += (targetRes - currentResonance) * 0.08;
        updateUIStateForMindfulness(elapsedSecs);
        cycleResonanceSum += currentResonance;
        cycleResonanceCount++;
        sumResonance += currentResonance;
        resonanceSamples++;
        let targetR = isCurrentPhaseInhale ? 255 : 56;
        let targetG = isCurrentPhaseInhale ? 180 : 189;
        let targetB = isCurrentPhaseInhale ? 77 : 248;
        currR += (targetR - currR) * 0.05;
        currG += (targetG - currG) * 0.05;
        currB += (targetB - currB) * 0.05;
        cachedColorStr = `${Math.floor(currR)}, ${Math.floor(currG)}, ${Math.floor(currB)}`;
        document.documentElement.style.setProperty('--c-r', Math.floor(currR));
        document.documentElement.style.setProperty('--c-g', Math.floor(currG));
        document.documentElement.style.setProperty('--c-b', Math.floor(currB));
        let bloom = Math.sin(guidePhase * (Math.PI / 2));
        guideRingEl.style.borderColor = `rgba(${cachedColorStr}, 0.75)`;
        guideRingEl.style.boxShadow = `0 0 ${12 + bloom * 24}px rgba(${cachedColorStr}, ${0.35 + bloom * 0.45}), inset 0 0 ${6 + bloom * 8}px rgba(255,255,255,${0.18 + bloom * 0.2})`;
        if (isPressing) {
          targetBreathScale = 0.7 - currentResonance * 0.1;
        } else {
          targetBreathScale = 1.1 + currentResonance * 0.2;
        }
        guideAnimFrame = requestAnimationFrame(animateGuide);
      }
      const firstClickEl = document.getElementById('first-click');
      function handleFirstClick(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (state !== 'INIT') return;
        state = 'INTRO';
        initAudio();
        initCanvas();
        if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        firstClickEl.style.pointerEvents = 'none';
        firstClickEl.style.opacity = '0';
        setTimeout(() => {
          firstClickEl.style.display = 'none';
          const introEl = document.getElementById('intro');
          introEl.style.display = 'flex';
          setTimeout(() => {
            introEl.style.opacity = '1';
          }, 50);
        }, 800);
      }
      firstClickEl.addEventListener('pointerdown', handleFirstClick);
      firstClickEl.addEventListener('touchstart', handleFirstClick, {
        passive: false
      });
      firstClickEl.addEventListener('click', handleFirstClick);
      document.getElementById('btn-start').addEventListener('click', (e) => {
        e.stopPropagation();
        if (state !== 'INTRO') return;
        state = 'PREPARATION';
        prepStartTime = performance.now();
        currentCoreScale = 0.25;
        isEndingDissolve = false;
        hasTriggeredRipple = false;
        currR = 255;
        currG = 180;
        cachedColorStr = "255, 180, 80";
        currentResonance = 0.0;
        document.documentElement.style.setProperty('--c-r', 255);
        document.documentElement.style.setProperty('--c-g', 180);
        document.documentElement.style.setProperty('--c-b', 80);
        requestWakeLock();
        document.getElementById('intro').style.opacity = '0';
        document.getElementById('btn-start').classList.add('disabled');
        document.getElementById('sky-bg').classList.add('active');
        const mainContainer = document.getElementById('main-container');
        const coreCanvasEl = document.getElementById('core-canvas');
        mainContainer.style.opacity = '1';
        coreCanvasEl.style.opacity = '1';
        if (hintEl) hintEl.classList.remove('flash-mild');
        const elementsToHide = [topHeaderEl, guideRingEl, textEl, hintEl];
        elementsToHide.forEach(el => {
          if (el) {
            el.style.transition = 'none';
            el.style.opacity = '0';
          }
        });
        if (textEl) {
          textEl.classList.remove('glow-inhale', 'glow-exhale');
          textEl.style.color = '#ffffff';
        }
        if (guideRingEl) {
          guideRingEl.style.transform = 'scale(1)';
          guideRingEl.style.borderColor = `rgba(255, 180, 80, 0.75)`;
          guideRingEl.style.boxShadow = `0 0 12px rgba(255, 180, 80, 0.35), inset 0 0 6px rgba(255,255,255,0.18)`;
        }
        void document.body.offsetHeight;
        setTimeout(() => {
          document.getElementById('intro').style.display = 'none';
        }, 1200);
        if (guideAnimFrame) cancelAnimationFrame(guideAnimFrame);
        guideAnimFrame = requestAnimationFrame(animateGuide);
      });
      if (pwaCloseBtnEl) {
        pwaCloseBtnEl.addEventListener('click', (e) => {
          e.stopPropagation();
          if (pwaPromptEl) {
            pwaPromptEl.style.opacity = '0';
            setTimeout(() => {
              pwaPromptEl.style.display = 'none';
            }, 500);
          }
          const coolDownUntil = Date.now() + 7 * 24 * 60 * 60 * 1000;
          try {
            localStorage.setItem('flow_pwa_cooldown', coolDownUntil.toString());
          } catch (err) {}
        });
      }
      document.getElementById('btn-stop').addEventListener('pointerdown', (e) => e.stopPropagation());
      document.getElementById('btn-stop').addEventListener('mousedown', (e) => e.stopPropagation());
      document.getElementById('btn-stop').addEventListener('touchstart', (e) => e.stopPropagation(), {
        passive: false
      });
      document.getElementById('btn-stop').addEventListener('click', (e) => {
        e.stopPropagation();
        if (state !== 'MINDFULNESS') return;
        state = 'SUMMARY';
        isEndingDissolve = true;
        releaseWakeLock();
        document.getElementById('interaction-layer').style.display = 'none';
        document.getElementById('btn-stop').style.pointerEvents = 'none';
        document.getElementById('btn-stop').style.opacity = '0';
        isPressing = false;
        stopAllBreathAudio();
        playEndingBowl();
        let totalSecs = sessionStartTime === 0 ? 0 : Math.max(0, Math.floor((Date.now() - sessionStartTime) / 1000));
        let mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
        let secs = String(totalSecs % 60).padStart(2, '0');
        document.getElementById('summary-time').innerText = `${mins}:${secs}`;
        document.getElementById('summary-stats').innerText = `共完成了 ${totalBreaths} 次呼吸`;
        const currentQuote = getRandomQuote();
        quoteTextEl.innerText = "「 " + currentQuote.text + " 」";
        quoteSourceEl.innerText = "—— " + currentQuote.source;
        const ua = navigator.userAgent || '';
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(ua);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        let isCoolingDown = false;
        try {
          const savedCoolDown = localStorage.getItem('flow_pwa_cooldown');
          if (savedCoolDown && Date.now() < parseInt(savedCoolDown, 10)) {
            isCoolingDown = true;
          }
        } catch (err) {}
        if (isMobileDevice && !isStandalone && !isCoolingDown && pwaPromptEl) {
          const isiOS = /iPhone|iPad|iPod/i.test(ua);
          if (isiOS) {
            pwaInstructionEl.innerHTML = "點擊下方選單欄的 <b>「分享 ⎋」</b> 按鈕<br>向上滑動選擇 <b>「加到主畫面 ⊕」</b> 即可完成。";
          } else {
            pwaInstructionEl.innerHTML = "點擊右上角 <b>「三個點 ⋮」</b> 選單按鈕<br>選擇 <b>「安裝應用程式」</b> 或 <b>「加到主畫面」</b>。";
          }
          pwaPromptEl.style.display = 'block';
          pwaInstructionEl.style.display = 'block';
          setTimeout(() => {
            pwaPromptEl.style.opacity = '1';
          }, 2000);
        } else if (pwaPromptEl) {
          pwaPromptEl.style.display = 'none';
        }
        document.getElementById('main-container').style.transition = 'opacity 4s ease';
        document.getElementById('main-container').style.opacity = '0';
        document.getElementById('sky-bg').style.transition = 'filter 4s ease';
        document.getElementById('sky-bg').style.filter = 'blur(80px)';
        document.getElementById('summary-overlay').style.display = 'flex';
        setTimeout(() => {
          document.getElementById('summary-overlay').style.opacity = '1';
        }, 100);
        setTimeout(() => {
          summaryQuoteCard.classList.add('show');
        }, 100);
        setTimeout(() => {
          document.getElementById('btn-end').style.pointerEvents = 'auto';
          document.getElementById('btn-end').style.opacity = '1';
        }, 7000);
      });
      document.getElementById('btn-end').addEventListener('click', (e) => {
        e.stopPropagation();
        if (state !== 'SUMMARY') return;
        state = 'TRANSITION';
        const blackScreen = document.getElementById('black-transition');
        blackScreen.style.pointerEvents = 'auto';
        blackScreen.style.opacity = '1';
        killAllOldNodes();
        fadeMasterOutAndSuspend();
        setTimeout(() => {
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(e => {});
          }
          bowlMasterGain = null;
          isEndingDissolve = false;
          summaryQuoteCard.classList.remove('show');
          const summaryOverlay = document.getElementById('summary-overlay');
          summaryOverlay.style.display = 'none';
          summaryOverlay.style.opacity = '0';
          if (pwaPromptEl) {
            pwaPromptEl.style.display = 'none';
            pwaPromptEl.style.opacity = '0';
          }
          const btnEnd = document.getElementById('btn-end');
          btnEnd.style.opacity = '0';
          btnEnd.style.pointerEvents = 'none';
          document.getElementById('main-container').style.opacity = '0';
          document.getElementById('sky-bg').classList.remove('active');
          document.getElementById('sky-bg').style.filter = 'blur(60px)';
          document.getElementById('hint').style.opacity = '0';
          document.getElementById('btn-start').classList.remove('disabled');
          document.getElementById('btn-stop').style.display = 'none';
          document.getElementById('btn-stop').style.pointerEvents = 'auto';
          textEl.classList.remove('glow-inhale', 'glow-exhale');
          textEl.style.opacity = '0';
          textEl.style.visibility = 'visible';
          missedInhaleCount = 0;
          userPressedInInhale = false;
          phaseChangeCount = 0;
          sessionStartTime = 0;
          baseInhalePace = 3.2;
          breathScale = 1.0;
          targetBreathScale = 1.0;
          currentResonance = 0.0;
          if (hintEl) hintEl.classList.remove('flash-mild');
          const elementsToReset = [topHeaderEl, guideRingEl, textEl, hintEl];
          elementsToReset.forEach(el => {
            if (el) {
              el.style.transition = 'none';
              el.style.opacity = '0';
            }
          });
          firstClickEl.style.display = 'flex';
          firstClickEl.style.pointerEvents = 'auto';
          firstClickEl.style.opacity = '1';
          document.getElementById('intro').style.display = 'none';
          document.getElementById('intro').style.opacity = '0';
          state = 'INIT';
          setTimeout(() => {
            blackScreen.style.opacity = '0';
            blackScreen.style.pointerEvents = 'none';
          }, 100);
        }, 1000);
      });
    </script>
  </body>
</html>
